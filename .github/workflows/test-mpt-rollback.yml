name: Test MPT Rollback
on:
  workflow_call:
    inputs:
      tessellation_version:
        required: true
        type: string

jobs:
  mpt-rollback-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: .github/action_scripts/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installing node dependencies
        shell: bash
        run: |
          npm i @stardust-collective/dag4@v2.8.0 
          npm i js-sha256
          npm i axios
          npm i brotli
          npm i zod
          npm i elliptic

      - name: Download shared_jars artifacts
        uses: actions/download-artifact@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: shared_jars-${{ inputs.tessellation_version }}
          path: .github/code/shared_jars

      - name: Download Hypergraph Artifact
        uses: actions/download-artifact@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: hypergraph-${{ inputs.tessellation_version }}
          path: .github/code/hypergraph

      - name: Download project template Artifact
        uses: actions/download-artifact@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: project-template-metagraph-${{ runner.os }}-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-${{ inputs.tessellation_version }}
          path: .github/code/metagraphs/project-template-metagraph

      - name: Start Hypergraph
        uses: "./.github/templates/actions/hypergraph/start"
        with:
          INCLUDE_DAG_L1: true
          DAG_L0_PORT_PREFIX: 90
          DAG_L1_PORT_PREFIX: 91

      - name: Test MPT Rollback - Basic
        run: |
          cd .github/action_scripts/mpt_rollback
          node mpt-rollback-test.js 90 91 testBasicRollback

      - name: Test MPT Rollback - Between DS
        run: |
          cd .github/action_scripts/mpt_rollback
          node mpt-rollback-test.js 90 91 testBetweenDS

      - name: Test MPT Rollback - Token Lock Replacement
        run: |
          cd .github/action_scripts/mpt_rollback
          node mpt-rollback-test.js 90 91 testReplacement

      - name: Upload log files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpt-rollback-node-log-files-${{ runner.os }}-${{ hashFiles('**/build.sbt', '**/project/*.sbt', '**/project/build.properties') }}-${{ inputs.tessellation_version }}
          path: .github/code/**/*.log
          if-no-files-found: warn
          retention-days: 3
