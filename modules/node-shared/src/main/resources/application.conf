allow-spends {
  last-valid-epoch-progress: {
    min: 5
    # Bumped from 200 → 500 post-#122 G1 finality-gating. Followers (dl1/cl1)
    # now consume only finalized gl0 snapshots, so their currentEpochProgress
    # lags gl0 production by up to depth-k (255 ords) in attestation-degraded
    # cases. Clients reading gl0 latest + buffer can exceed validator's view by
    # finality-lag + client-buffer; max=500 absorbs worst-case 255 lag + 50
    # buffer + 100 safety. Still bounded (≈50 min at ~6s/epoch).
    max: 500
  }
}

