gossip {
  storage {
    peer-rumors-capacity = 50
    peer-rumors-capacity = ${?CL_GOSSIP_PEER_RUMORS_CAPACITY}
    active-common-rumors-capacity = 20
    active-common-rumors-capacity = ${?CL_GOSSIP_ACTIVE_COMMON_RUMORS_CAPACITY}
    seen-common-rumors-capacity = 50
    seen-common-rumors-capacity = ${?CL_GOSSIP_SEEN_COMMON_RUMORS_CAPACITY}
  }
  daemon {
    peer-round {
      fanout = 2
      fanout = ${?CL_GOSSIP_PEER_ROUND_FANOUT}
      interval = 0.5 seconds
      interval = ${?CL_GOSSIP_PEER_ROUND_INTERVAL}
      max-concurrent-rounds = 10
      max-concurrent-rounds = ${?CL_GOSSIP_PEER_ROUND_MAX_CONCURRENT}
      max-ordinals-per-request = 100
      max-ordinals-per-request = ${?CL_GOSSIP_PEER_ROUND_MAX_ORDINALS}
    }
    common-round {
      fanout = 1
      fanout = ${?CL_GOSSIP_COMMON_ROUND_FANOUT}
      interval = 0.5 seconds
      interval = ${?CL_GOSSIP_COMMON_ROUND_INTERVAL}
      max-concurrent-rounds = 4
      max-concurrent-rounds = ${?CL_GOSSIP_COMMON_ROUND_MAX_CONCURRENT}
    }
  }
  timeouts {
    routes = 30 seconds
    routes = ${?CL_GOSSIP_ROUTES_TIMEOUT}
    client = 15 seconds
    client = ${?CL_GOSSIP_CLIENT_TIMEOUT}
  }
}

