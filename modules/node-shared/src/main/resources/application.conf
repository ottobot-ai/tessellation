nakamoto {
  # Confirmation depth k₁ — the SINGLE free consensus-depth knob. The two related depths
  # (R = eta-rotation period, k₂ = archive/retention depth) are DERIVED from k₁ in
  # `NakamotoConfig` (node-shared config/types.scala), NOT configured independently:
  #   * R  = round(3.1·k₁)   (eta-rotation-snapshots) — Ouroboros: eta uses the first 2/3
  #          of the period's VRF rho values, so the last 1/3 = R/3 must be ≥ k₁ (FINALIZED
  #          before use) ⇒ R ≥ 3·k₁; the .1 over 3 is the worst-case finalization margin
  #          (the 2/3-mark must FINALIZE before the boundary; finalization lags by ≤ k₁) ⇒
  #          margin (R/3−k₁) = 0.033·k₁. See #31 eta-amortization.
  #   * k₂ = 100·k₁          (keep-depth-behind-finalized) — historical-archive / phase-3
  #          retention depth (tower moving checkpoint); deep deliberately (slow, stable
  #          consensus history, ≈8 days at k₁=1024 / 7s snapshots).
  #
  # k₁ is the operational "you'll never see a reorg past this point" finality gate
  # (mainnet 1024 — a deep, slow, stable consensus epoch; far past the 10⁻¹² security need
  # at k≈290, deliberately). REUSED by the §3 NIPoPoW historical-commitment SMT as its finalized
  # cutoff: `smtRoot(N)` commits per-ordinal commitments ONLY for finalized ordinals
  # i ≤ N − k₁. `SnapshotLeaderLoop.ConfirmationDepthK` / `NakamotoSyncDaemon` read the same
  # typed config so all sites agree.
  #
  # PER-ENVIRONMENT (mirrors `last-kryo-hash-ordinal` etc.): keyed by AppEnvironment and resolved
  # ONCE for the active env at the use site (`NakamotoConfig.confirmationDepthK(env)`); R and k₂
  # then DERIVE from the resolved k₁. Powers of two to avoid off-by-one surprises: mainnet keeps the
  # deep 1024; test/integration nets run the security-sufficient 256; dev runs a fast 32 so local
  # clusters finalize quickly. The `${?NAKAMOTO_CONFIRMATION_DEPTH}` override is applied to the `dev`
  # value only (so it resolves to the env var when set, else 32) — mainnet/testnet/integrationnet
  # stay fixed, consensus-critical.
  confirmation-depth-k {
    mainnet: 1024
    testnet: 256
    integrationnet: 256
    dev: 32
    dev: ${?NAKAMOTO_CONFIRMATION_DEPTH}
  }

  # Slot duration in milliseconds — the unit of consensus time (design §5.7: "1 s is a CHOICE";
  # the GL0 lottery and execution-shard staircase duty both advance on this grid). 1000 ms
  # in production; tests may run 500 ms for faster cadence via the env override. Migrated from the
  # SnapshotLeaderLoop sys.env read (project rule: HOCON over scattered env reads).
  slot-duration-ms = 1000
  slot-duration-ms = ${?NAKAMOTO_SLOT_DURATION_MS}

  # gl0 LDD snowplow parameters — CONSENSUS-CRITICAL (identical on every node or the cluster forks).
  # Migrated from the NAKAMOTO_LDD_* sys.env reads in GlobalSnapshotConsensus (HOCON rule; 2026-06-12
  # idiom audit). CONFIG IS AUTHORITATIVE — there is NO source-level default (LddConfig.Default removed 2026-06-30).
  # `baseline` (fB) and `amplitude` (fA) are EXACT fractions "n/d" → parsed straight into Ratio, never through Double
  # (0.05-as-Double round-trips into a garbage denominator; "1/20" is exactly 1/20 on every node).
  # gamma=16 ⇒ ~7 s median block @ 1 s slots (Ethereum-competitive; 7-8 s is the fork/latency compromise).
  ldd {
    cutoff = 16
    cutoff = ${?NAKAMOTO_LDD_CUTOFF}
    offset = 1
    offset = ${?NAKAMOTO_LDD_OFFSET}
    baseline = "1/20"
    baseline = ${?NAKAMOTO_LDD_BASELINE}
    amplitude = "1/2"
    amplitude = ${?NAKAMOTO_LDD_AMPLITUDE}
  }


  # Coordinated genesis wall-clock time (epoch ms). 0 = UNSET: the node falls back to its local clock at
  # boot with a WARN — acceptable ONLY for a solo dev node; multi-node clusters MUST set it identically
  # (the harness exports NAKAMOTO_GENESIS_TIME_MS) or slot indices diverge.
  genesis-time-ms = 0
  genesis-time-ms = ${?NAKAMOTO_GENESIS_TIME_MS}

  # Genesis eta seed string (period-0 randomness). Constant by default — operators overriding it
  # differently would silently fork; the override exists for isolated test networks only.
  genesis-eta-seed = "tessellation-nakamoto-genesis"
  genesis-eta-seed = ${?NAKAMOTO_GENESIS_ETA}

  # Snowball decision margin (beta) for the attestation accumulator — consensus-relevant decision
  # threshold (GPU-sim-locked production point K=8/alpha=5/beta=10; see SnowballAccumulator scaladoc).
  # K and alpha live as code constants until the upstream cascade consumes them.
  snowball-beta = 10
  snowball-beta = ${?NAKAMOTO_SNOWBALL_BETA}

  # #259 active-recovery orphan-buffer sizing. Migrated from the NAKAMOTO_ORPHAN_BUFFER_CAP /
  # NAKAMOTO_RECENT_ADMIT_CAP env reads to typed HOCON (project rule: no scattered sys.env).
  # `orphan-buffer-cap` bounds total buffered orphan metagraph binaries (1024 × ~10 KiB ≈ 10 MiB
  # worst-case, in-flight backlog only); `recent-admit-cap` is the recent-admission dedup cache,
  # kept proportionally larger (4×) for headroom across metagraphs during the ~7s GSI window.
  orphan-buffer-cap = 1024
  orphan-buffer-cap = ${?NAKAMOTO_ORPHAN_BUFFER_CAP}
  recent-admit-cap = 4096
  recent-admit-cap = ${?NAKAMOTO_RECENT_ADMIT_CAP}

  # Fork-recovery master switch for `RebootstrapOrchestrator` (migrated from NAKAMOTO_REBOOTSTRAP_ENABLED). Default TRUE:
  # a node that self-finalized a divergent branch and refuses canonical peers self-heals (reset + re-seed). With it OFF
  # a locked-out node forks the global mptRoot forever (the sharded data-app-fee reorg storm). Conservative trigger
  # (K sustained different-hash writes at-or-below finalized). Operators can pin per-node via the env override.
  #
  # Track-3 S5 (p11-retire) GATE — do NOT flip this default in the S5 slice. The TRUE→FALSE flip is HARD-GATED on
  # BOTH the density-past-k₁ deep-reorg path (`band-density-reorg-enabled`, S3) AND the disk-backed k₂ revert-executor
  # (S4) being e2e-green, PLUS a deep-fork cluster-uniformity sim. Until then Rebootstrap stays ON as the PRIMARY
  # divergent-self-finalize recovery. Post-flip the mechanism is RETAINED as the manual last-resort escape hatch
  # (operators re-enable per-node via the ${?NAKAMOTO_REBOOTSTRAP_ENABLED} override above).
  rebootstrap-enabled = true
  rebootstrap-enabled = ${?NAKAMOTO_REBOOTSTRAP_ENABLED}

  # Track-3 S3 CONFIG-FLAG: band-density deep-reorg (kill the k₁-absolute floor). Default FALSE.
  #   * false = legacy k₁-freeze fork choice — the NakamotoChainStore store-gate AND ChainSelection
  #     .shouldSwitch both key off the k₁ finalized marker (byte-identical to the post-376d09fbc
  #     baseline; the 2026-06-27 fork-storm backstop). numShards=1 + short runs stay on this.
  #   * true  = re-key BOTH to the k₂ "settled" marker (100·k₁, advanced by the T_depth2 sink), so a
  #     fork in the (settled, finalized] band is density-revertable (maxvalid-bg), plus the commutative
  #     true-MRCA density comparator so nodes on opposite band branches converge.
  # CONSENSUS-CRITICAL + CLUSTER-UNIFORM: every node MUST run the same value (a split forks the chain).
  # Keep OFF until a deep-fork sim validates cluster-uniformity — attempt #2 of the reverted 86f390130.
  # The gl0 PRODUCTION floor (SnapshotLeaderLoop) stays k₁ regardless of this flag (deliberate asymmetry).
  band-density-reorg-enabled = false
  band-density-reorg-enabled = ${?NAKAMOTO_BAND_DENSITY_REORG_ENABLED}

  # ml0 gl0-follow changeset transport (task #12 — cut ml0 full-GSI RESYNC frequency).
  # `changeset-ring-depth` bounds the gl0 producer's SERVED ring of recent FINALIZED per-ordinal
  # accumulators (the typed deltas ml0 adopts-and-verifies). A follower more than this many finalized
  # ordinals behind its `since` falls back to a heavy full-GSI majority resync; widening it from the
  # prior hardcoded 256 to 1024 keeps ml0 on the light incremental path across a longer lag window.
  # MEMORY TRADEOFF: each retained accumulator is the FULL typed changeset for one ordinal (can be
  # sizeable under load), so this ring is ~1024 × per-ordinal-changeset of resident heap on every gl0
  # node — bump down on memory-constrained deploys, up if ml0 followers lag further behind.
  # `staging-accumulators-cap` bounds the producer's hash-keyed STAGING map of accumulators awaiting
  # finalization; the steady-state bound is the finalized-watermark prune, so this size cap is only a
  # backstop for a burst of never-finalizing forks between two finalize ticks and is held at 2× the
  # served ring. Both are pure transport memory bounds — NOT consensus parameters (a missed delta only
  # forces that one ordinal onto the full-GSI fallback, never an incorrect adopt).
  changeset-ring-depth = 1024
  changeset-ring-depth = ${?NAKAMOTO_CHANGESET_RING_DEPTH}
  staging-accumulators-cap = 2048
  staging-accumulators-cap = ${?NAKAMOTO_STAGING_ACCUMULATORS_CAP}

  # Signed-byte-store read-time BACKFILL (2026-07-09) — heals HOLES in gl0's contiguous signed byte
  # store (`mpt_snapshot_info_signed`). Creation-side staging races (fail-closed reorg adopts,
  # same-ordinal proposal-race losses, catch-up jumps) can leave an ordinal permanently missing;
  # when a shard checkpoint then stamps that ordinal as its `executionBaseOrdinal`, the pinned execution-base
  # read fail-closes forever and the metagraph mirror freezes. The backfill pulls the signed byte map
  # for the missing ordinal from up to `pinned-backfill-max-peers` responsive peers (each try bounded
  # by `pinned-backfill-per-peer-timeout` so a hung peer cannot stall the accept fold), verifies it
  # against the node's OWN locally-committed stateProof.mptRoot at that ordinal, strips to the
  # consensus entry set, and stages it. Transport tunables ONLY — verification is unconditional and a
  # total miss stays fail-closed (defer), so these are NOT consensus parameters. 0 peers = disabled.
  pinned-backfill-max-peers = 3
  pinned-backfill-max-peers = ${?NAKAMOTO_PINNED_BACKFILL_MAX_PEERS}
  pinned-backfill-per-peer-timeout = 5s
  pinned-backfill-per-peer-timeout = ${?NAKAMOTO_PINNED_BACKFILL_PER_PEER_TIMEOUT}

  # §3 NIPoPoW historical-commitment SMT (HistoricalCommitmentSmtStore). Unbounded tree
  # keyed by snapshot ordinal; its single root is anchored as `smtRoot` in the gl0 state
  # proof. The TREE (leaf set) grows forever; this knob bounds only the number of recent
  # historical ROOTS kept queryable for inclusion proofs of past ordinals (a separate
  # window from the `confirmation-depth-k` finalized lag). Must be >= 1.
  commitment-smt {
    version-root-retention = 256
    version-root-retention = ${?NAKAMOTO_COMMITMENT_SMT_VERSION_RETENTION}
  }

  # LocalEvents reactive gRPC stream (docs/nakamoto/LOCAL-EVENTS-SERVICE-DESIGN.md).
  # Off by default; e2e flips on via env substitution or HOCON override.
  # v1 emits 6 of 7 immediate event types. AllowSpendStateChange.CONSUMED
  # is reserved in the proto but not emitted; see LOCAL-EVENTS-SERVICE-DESIGN.md.
  local-events {
    # Master switch. Default OFF in production. e2e + GUI deployments override.
    enabled = false
    enabled = ${?NAKAMOTO_LOCAL_EVENTS_ENABLED}

    # Bind address. Default loopback. Docker e2e overrides to 0.0.0.0 so the host
    # can reach the container.
    bind-address = "127.0.0.1"
    bind-address = ${?NAKAMOTO_LOCAL_EVENTS_BIND}

    # Separate from ChainSyncInbound (50053) so external subscribers can't reach
    # the sidecar's data plane and a wedged subscriber can be restarted without
    # bouncing libp2p.
    port = 50054
    port = ${?NAKAMOTO_LOCAL_EVENTS_PORT}

    # Per-subscriber queue depth. Drop-oldest if a subscriber falls behind. ~15 min
    # buffer at 8 events/ord × 7s/ord.
    max-queued-per-subscriber = 1024
    max-queued-per-subscriber = ${?NAKAMOTO_LOCAL_EVENTS_MAX_QUEUED}

    # Process-wide publisher Topic backstop. Should never be reached under normal load.
    publisher-buffer-size = 4096
    publisher-buffer-size = ${?NAKAMOTO_LOCAL_EVENTS_BUFFER}

    # Shutdown grace period — matches ChainSyncInbound's 5-second grace.
    shutdown-grace-seconds = 5
    shutdown-grace-seconds = ${?NAKAMOTO_LOCAL_EVENTS_SHUTDOWN_GRACE}
  }

  # Committee draw/quorum decouple (COMMITTEE-SORTITION-DESIGN.md §5). Both committees
  # contain eligible GL0 operators, but their draw mechanisms are distinct: metagraph-binary
  # admission is a true per-binary secret-key VRF; execution-shard membership is an enumerable
  # public hash seeded by each registered VRF VK. Both currently use uniform σ = 1/N.
  # `k-draw` sizes either draw (threshold = min(k-draw·σ, 1), so
  # expected committee ≈ k-draw·σ·N; with uniform σ = 1/N that's ≈ k-draw, and
  # k-draw = N saturates the threshold to 1 ⇒ committee = everyone). `k-quorum` is the
  # admit count the gate / shard acceptance waits for — the count DIRECTLY (no 2/3
  # multiplier). INVARIANT (fail-fast at load): 0 < k-quorum <= k-draw, and pick k-draw
  # large enough that P(|committee| ≥ k-quorum) ≈ 1 (k-draw ≥ ~1.5·k-quorum, or k-draw = N).
  # Decoupling fixes the throughput lag where expected-committee == admit-quorum left
  # ~36% of binaries with a committee too small to ever reach quorum (gate timeout →
  # re-buffer churn → gl0 trails ml0). 8-node testnet default: k-draw = 8 (= N ⇒
  # committee = all 8), k-quorum = 6 (2/3 of N).
  committee {
    k-draw = 8
    k-draw = ${?NAKAMOTO_COMMITTEE_K_DRAW}
    k-quorum = 6
    k-quorum = ${?NAKAMOTO_COMMITTEE_K_QUORUM}
  }

  # Hierarchical-shard-checkpoints v1 — typed config shape (see
  # docs/nakamoto/HIERARCHICAL-SHARD-CHECKPOINTS-DESIGN.md §4.2). Defaults
  # collapse to the degenerate single-shard case (`num-shards = 1`) so this
  # block is a no-op until other slices consume it. The shard committee DRAW
  # target + ADMIT quorum live in `nakamoto.committee` (k-draw / k-quorum),
  # shared with the per-metagraph gate — NOT here.
  sharding {
    # Number of static shards. `num-shards = 1` is the degenerate single-shard
    # case — every metagraph maps to shard 0 and the new code path becomes a
    # no-op for current setups. Production target scales with operator count.
    num-shards = 1
    num-shards = ${?NAKAMOTO_NUM_SHARDS}

    # Bounded in-memory shard-checkpoint history. This is storage retention only:
    # it never qualifies a checkpoint and cannot substitute for execution k-quorum.
    retention {
      retained-checkpoints = 8
      retained-checkpoints = ${?NAKAMOTO_SHARD_RETAINED_CHECKPOINTS}
    }

    # Granularity (Option C per SHARD-CHECKPOINT-GRANULARITY.md).
    checkpoint {
      # EXECUTION-SHARDING R-1: per-shard cap on the raw-binary intake buffer
      # (ShardBinaryBuffer). At cap, NEW distinct binaries are rejected (chain-safe
      # overflow — never evict an older binary the producer may still chain off).
      binary-buffer-cap = 4096

      binary-buffer-cap = ${?NAKAMOTO_SHARD_BINARY_BUFFER_CAP}

      # Shuffled-staircase proposal window (design §5.7 rev 2, owner 2026-06-12). Per shard ordinal the
      # committee is hash-sorted under the epoch eta; rank r proposes for this many slots, wrapping modulo
      # committee size. Replaces the per-slot LDD lottery: run-13/14 showed ANY lottery density at a small
      # committee forks at genesis and siblings under quorum lag, splitting attestations below kQuorum —
      # only a unique-producer-per-window schedule avoids it (same reason Polkadot parachains run Aura
      # round-robin while the relay chain runs a lottery).
      staircase-delta-slots = 5
      staircase-delta-slots = ${?NAKAMOTO_SHARD_STAIRCASE_DELTA_SLOTS}

      # Boot grace: a node takes NO shard duty until it has been Ready this many slots — its intake
      # (gossip stream attach + queued checkpoints) must drain first, or a late-booting rank takes
      # genesis duty BLIND and seeds a rival lineage (run-17: second ord-1 at exactly slot 61, the
      # first slot of rank-1's genesis window). Liveness-safe: duty wraps; at true cluster genesis
      # this only delays the first checkpoint by the grace.
      boot-grace-slots = 30
      boot-grace-slots = ${?NAKAMOTO_SHARD_BOOT_GRACE_SLOTS}

      # Loss-recovery re-publish cadence (task #45, run-19). A node mints each (shardId, shardOrdinal)
      # at most ONCE and holds it; until that ordinal is adopted or an anchor-reorg moves the tip out
      # from under it, it re-gossips the SAME bytes every this-many produce ticks instead of re-minting
      # with a fresh gl0-anchor (re-minting churned the hash every tick — run-19 saw 34 variants for one
      # ordinal — and split attestations below kQuorum). ~6 ticks ≈ confirmation RTT (mirrors the run-12
      # sender cadence-gate). 1 = re-publish every tick.
      republish-every-ticks = 6
      republish-every-ticks = ${?NAKAMOTO_SHARD_REPUBLISH_EVERY_TICKS}

      # Chain-sync recovery (run-20, task #A): pull a missed shard checkpoint from a peer over the p2p port
      # instead of waiting minutes for GossipSub re-gossip (which dedups Tier-1's identical re-publish bytes by
      # msgid until the seen-cache TTL expires). An empty store pulls ordinal 1 (the genesis-miss case).
      stuck-ms = 5000
      stuck-ms = ${?NAKAMOTO_SHARD_STUCK_MS}
      absence-tick-interval-ms = 2000
      absence-tick-interval-ms = ${?NAKAMOTO_SHARD_ABSENCE_TICK_INTERVAL_MS}
      pull-dedup-cooldown-ms = 30000
      pull-dedup-cooldown-ms = ${?NAKAMOTO_SHARD_PULL_DEDUP_COOLDOWN_MS}
    }

  }

  # WATCHTOWER invalid-state-proof slashing — the 100% `InvalidStateProof` tier
  # (SLASHING-DESIGN.md §6 + WATCHTOWER-FRAUD-PROOF-DESIGN.md). This is the
  # evidence-based total-loss tier for a committee that signed a checkpoint whose
  # per-MG derivation an honest re-execution does not
  # reproduce. INERT at num-shards = 1 (no committee checkpoints exist). The challenge
  # window is NOT a knob here: it is `nakamoto.confirmation-depth-k` (k₁) — the GSAM
  # gate keeps a checkpoint's economic effects reversible until k₁ finalized ordinals
  # after adoption so a fraud proof can land.
  invalidity-slashing {
    # Master switch for the watchtower approval-check (per-checkpoint re-execution +
    # fraud-proof gossip). Default ON; inert at num-shards = 1.
    watchtower-enabled = true
    watchtower-enabled = ${?NAKAMOTO_WATCHTOWER_ENABLED}

    # Fraction of the offender's combined (delegated + collateral) stake destroyed.
    # 1.0 = total loss (the InvalidStateProof tier is maximum severity). A value < 1.0
    # reduces delegated stake proportionally and still fully removes collateral.
    slash-fraction = "1/1"
    slash-fraction = ${?NAKAMOTO_INVALIDITY_SLASH_FRACTION}

    # Fraction of the slashed pool credited to the fraud-proof submitter; remainder
    # burns. 0.05 = 5% — incentivises running a watchtower without letting a
    # self-attacker recover via self-submission (95% burns).
    bounty-fraction = "1/20"
    bounty-fraction = ${?NAKAMOTO_INVALIDITY_BOUNTY_FRACTION}

    # Epochs the slashed operator is excluded from the active set (cannot rejoin a
    # committee / contribute to quorum). 100 = matches the equivocation cooldown.
    cooldown-epochs = 100
    cooldown-epochs = ${?NAKAMOTO_INVALIDITY_COOLDOWN_EPOCHS}

    # Bounded retry for the watchtower emitter's fraud-proof publish over the LOCAL
    # sidecar gRPC hop (EPIC-9-NET M4 "retry-or-outbox"). A fraud proof is slashing
    # evidence — a single warn-and-drop on a transient sidecar restart silently
    # disarmed the watchtower tooth. Once the RPC lands, the sidecar's durable
    # outbox owns network delivery (republish-until-TTL). Node-local QoS knobs,
    # NOT consensus-critical.
    fraud-proof-publish-attempts = 3
    fraud-proof-publish-attempts = ${?NAKAMOTO_FRAUD_PROOF_PUBLISH_ATTEMPTS}
    fraud-proof-publish-retry-delay = 2 seconds
    fraud-proof-publish-retry-delay = ${?NAKAMOTO_FRAUD_PROOF_PUBLISH_RETRY_DELAY}
  }
}

click-house-config {
 max-retries = 3
 max-queue-size = 10000
 retry-base-delay = 1 second
 batch-size = 1000
 flush-interval = 5 seconds
 retention-period-in-days = 90
 error-pause-duration = 30 seconds

 host = ${?CLICKHOUSE_HOST}
 user = ${?CLICKHOUSE_USER}
 password = ${?CLICKHOUSE_PASSWORD}
 logs-table-name = ${?CLICKHOUSE_LOGS_TABLE_NAME}
 metrics-table-name = ${?CLICKHOUSE_METRICS_TABLE_NAME}
 port = 8443
 port = ${?CLICKHOUSE_PORT}
 database = default
 database = ${?CLICKHOUSE_DATABASE}
}
