services:
  ml0:
    # METAGRAPH_NET_PREFIX is per-metagraph (NET_BASE.${k+1}); fallback to
    # NET_PREFIX preserves single-metagraph behaviour when METAGRAPH_NET_PREFIX
    # is unset (e.g. legacy invocations).
    networks:
      tessellation_common:
        aliases:
          - ml0${CONTAINER_NAME_SUFFIX:-}
        ipv4_address: ${METAGRAPH_NET_PREFIX:-${NET_PREFIX}}.3${CONTAINER_OFFSET:-0}
  cl1:
    networks:
      tessellation_common:
        aliases:
          - cl1${CONTAINER_NAME_SUFFIX:-}
        ipv4_address: ${METAGRAPH_NET_PREFIX:-${NET_PREFIX}}.4${CONTAINER_OFFSET:-0}
  dl1:
    networks:
      tessellation_common:
        aliases:
          - dl1${CONTAINER_NAME_SUFFIX:-}
        ipv4_address: ${METAGRAPH_NET_PREFIX:-${NET_PREFIX}}.5${CONTAINER_OFFSET:-0}
          
# declare the external network (must already exist)
networks:
  tessellation_common:
    external: true
