# Nakamoto mode overlay for the standard gl0 service.
#
# Layered in by compose-runner.sh alongside the sidecar overlay. The gl0 binary
# is Nakamoto-only — the run-nakamoto CLI command is selected by entrypoint.sh
# when NAKAMOTO_MODE=true. Tunables below configure LDD, sidecar, and genesis.
services:
  gl0:
    environment:
      # Signals entrypoint.sh to use `run-nakamoto` instead of BFT commands
      - NAKAMOTO_MODE=true
      # Coordinated genesis time — set per cluster by compose-runner.sh and
      # written into each per-node .env file. Every node MUST agree on this.
      - NAKAMOTO_GENESIS_TIME_MS=${NAKAMOTO_GENESIS_TIME_MS}
      - NAKAMOTO_GENESIS_ETA=tessellation-nakamoto-genesis
      # LocalEvents reactive gRPC stream (replaces polling-based e2e test waits).
      # On by default in the test cluster so the JS test scripts can subscribe via
      # @grpc/grpc-js. Toggle off by overriding NAKAMOTO_LOCAL_EVENTS_ENABLED=false.
      # The HOCON `${?NAKAMOTO_LOCAL_EVENTS_ENABLED}` substitution in application.conf
      # reads this env var at JVM startup — NEVER `sys.env.get` in code (project rule).
      - NAKAMOTO_LOCAL_EVENTS_ENABLED=${NAKAMOTO_LOCAL_EVENTS_ENABLED:-true}
      # 0.0.0.0 so the test container can reach the service across the docker network
      # (default is loopback for production safety; e2e clusters override here).
      - NAKAMOTO_LOCAL_EVENTS_BIND=${NAKAMOTO_LOCAL_EVENTS_BIND:-0.0.0.0}
      - NAKAMOTO_LOCAL_EVENTS_PORT=${NAKAMOTO_LOCAL_EVENTS_PORT:-50054}
      # LDD snowplow tunables — production-aligned values (within rounding) so
      # the test cluster exercises the same eligibility curve as mainnet.
      # Earlier 2× test overrides (32/2/0.1/1.0) didn't actually speed up chain
      # growth — block production is wall-clock bound, not eligibility bound,
      # so doubling fA just changed the fill-rate metric without producing
      # snapshots faster.
      - NAKAMOTO_SLOTS_PER_EPOCH=${NAKAMOTO_SLOTS_PER_EPOCH:-60}
      # k₁ (confirmation depth) + derived R=round(3.1·k₁) and k₂=100·k₁ come from the per-env
      # `confirmation-depth-k` block in application.conf. All e2e nodes run as Dev (CL_APP_ENV=dev),
      # so they resolve k₁=32 → R=99, exercising the eta rotation many times per run (tests aren't
      # adversarial, small k₁ is fine). No NAKAMOTO_CONFIRMATION_DEPTH override needed — the conf's
      # per-env value is authoritative. See `docs/nakamoto/attestation-and-finality.md` §1.3.
      # LDD snowplow leader election (EligibilityChecker.threshold). Per slot, validator v is eligible iff
      # VRF(eta‖slot) < threshold_v = 1 − (1 − f(δ))^relativeStake_v, where δ = slots since the last snapshot.
      # Because validator relative-stakes sum to 1, the CLUSTER per-slot production probability collapses to
      # exactly f(δ): P(someone wins) = 1 − ∏_v (1−f)^stake_v = 1 − (1−f)^Σstake = 1 − (1−f) = f(δ). So f IS the
      # cluster hazard rate and the inter-snapshot GAP is a renewal process driven by it. Shape of f(δ):
      #   δ < offset            : 0            (dead zone — no same-slot/instant re-production)
      #   offset ≤ δ < cutoff    : (δ−offset)/(cutoff−offset) · amplitude   (linear ramp 0 → amplitude)
      #   δ ≥ cutoff            : baselineDifficulty                        (drops to the slow recovery floor)
      # ⇒ probability mass concentrates on the ramp window [offset,cutoff); a thin tail spills past cutoff at the
      # low baseline rate. survival-to-cutoff (prob no winner by the deadline) ≈ exp(−½·amplitude·(cutoff−offset)).
      #
      # How the stationary gap distribution moves with each knob:
      #   cutoff ↑ → wider window, LOWER per-slot hazard → SLOWER rate (longer mean gap) AND LIGHTER tail (more
      #              integrated ramp-hazard before the deadline ⇒ far less spill into the slow floor).
      #   cutoff ↓ → faster median but HEAVIER tail (more spill → long stalls) — counterproductive, do not.
      #   amplitude ↑ → fires earlier + lighter spill (faster) but raises same-slot multi-winner (FORK) rate.
      #   baseline  ↑ → faster recovery from a rare past-cutoff stall (lighter tail), low fork cost.
      #
      # DECISION (2026-06-23) — cutoff=16 KEPT. The 2mg/2shard run validated cutoff=16 CLEAN: genuine 2-shard
      # occupancy, ContentMismatch=0 (no MPT divergence), ~13 reorgs/min UNIFORM (benign LDD churn, not a storm),
      # cadence ~7.5 ord/min, sync held via the metagraph-caught-up readiness gate (NOT by slowing the chain).
      # DEFENSIVE OPTION cutoff=30 (documented, NOT active): widens the window → mean gap ~8→~18-20 slots, cutting
      # the reorg churn + tail spill (survival-to-cutoff 2.3%→0.07%) and buying sync headroom for LARGER topologies
      # (16/5/5) — at ~2× slower runs (~3-4 ord/min). Bring it in only if churn/sync degrade at scale. Harness waits
      # are ordinal-reactive (pace-independent) so either cutoff is safe test-side. CAVEAT for cutoff=30: slower
      # ordinals shift the ordinals-per-epoch ratio (epoch=60 SLOTS not ordinals) → watch epoch-windowed logic
      # (token-lock-replacement WithdrawalTimeLimit).
      # Test-only (overlay); mainnet uses the application.conf `nakamoto.ldd` defaults. amplitude/baseline are the
      # "go faster" knobs (NOT cutoff↓) if throughput is ever wanted; left at defaults here since the goal is sync headroom.
      - NAKAMOTO_LDD_CUTOFF=${NAKAMOTO_LDD_CUTOFF:-16}
      - NAKAMOTO_LDD_OFFSET=${NAKAMOTO_LDD_OFFSET:-1}
      - NAKAMOTO_LDD_BASELINE=${NAKAMOTO_LDD_BASELINE:-0.05}
      - NAKAMOTO_LDD_AMPLITUDE=${NAKAMOTO_LDD_AMPLITUDE:-0.5}
      # Test-only slot duration. Production default is 1000ms (in SnapshotLeaderLoop).
      # Kept at 1000ms because halving slot duration also halves wall-clock per epoch
      # (slots-per-epoch is fixed at 60), which made the token-lock-replacement edge
      # cases flake — the WithdrawalTimeLimit window closes before the L1 syncs the
      # new lock. If we want faster slots we'd need to scale slots-per-epoch too.
      - NAKAMOTO_SLOT_DURATION_MS=${NAKAMOTO_SLOT_DURATION_MS:-1000}
      # Committee-sortition target size. Unset → gate is degenerate (K=N, all
      # validators in committee, sortition is a no-op). Set to a value < N for
      # genuine sortition: each metagraph binary requires ceil(2K/3) attestations
      # from the K-sized committee. Plumbed by `--shards=N` in set-env.sh.
      # Default MUST mirror the HOCON default (committee-k-target = 4): HOCON's
      # `${?NAKAMOTO_COMMITTEE_K_TARGET}` treats a present-but-empty env var as the
      # string "" (not absent), which fails NUMBER parsing. A bare `:-` empty
      # default crashes config load on any run that doesn't pass --shards.
      - NAKAMOTO_COMMITTEE_K_TARGET=${NAKAMOTO_COMMITTEE_K_TARGET:-4}
      # Committee draw/quorum (COMMITTEE-SORTITION-DESIGN.md §5; decoupled from the dead K_TARGET above).
      # k-draw sizes the committee draw (= N saturates ⇒ committee = all); k-quorum is the admit count.
      # Defaults MUST mirror the HOCON defaults (k-draw=8, k-quorum=6) — same empty-string NUMBER-parse hazard
      # as K_TARGET. For a reduced-gl0 run set BOTH coherently (invariant 0 < k-quorum <= k-draw, k-draw≈N):
      # e.g. at --num-gl0=5 → NAKAMOTO_COMMITTEE_K_DRAW=5 NAKAMOTO_COMMITTEE_K_QUORUM=3.
      - NAKAMOTO_COMMITTEE_K_DRAW=${NAKAMOTO_COMMITTEE_K_DRAW:-8}
      - NAKAMOTO_COMMITTEE_K_QUORUM=${NAKAMOTO_COMMITTEE_K_QUORUM:-6}
      # Hierarchical shard-checkpoint sharding. num-shards = 1 (default) keeps the
      # new shard path inert — byte-identical to pre-sharding behavior. num-shards
      # > 1 activates per-shard ShardCheckpoint production + gl0 aggregation
      # (HIERARCHICAL-SHARD-CHECKPOINTS-DESIGN.md). Read via the
      # `${?NAKAMOTO_NUM_SHARDS}` substitution in application.conf — never sys.env.
      # Default MUST mirror the HOCON default (num-shards = 1) — same empty-string
      # NUMBER-parse hazard as committee-k-target above.
      - NAKAMOTO_NUM_SHARDS=${NAKAMOTO_NUM_SHARDS:-1}
      # Local sidecar gRPC endpoint — sidecar service runs on the same docker
      # network with the matching CONTAINER_NAME_SUFFIX.
      - SIDECAR_HOST=sidecar${CONTAINER_NAME_SUFFIX:-}
      - SIDECAR_GRPC_PORT=50051
    ports:
      # Expose LocalEvents gRPC to the host so the JS e2e scripts can subscribe.
      # External port per node (50054 for gl0-0, 50064 for gl0-1, etc. — see
      # docker-env-setup.sh CL_DOCKER_EXTERNAL_GL0_LOCAL_EVENTS calculation).
      # Internal port is whatever NAKAMOTO_LOCAL_EVENTS_PORT resolves to (default 50054).
      - "${CL_DOCKER_BIND_INTERFACE:-}${CL_DOCKER_EXTERNAL_GL0_LOCAL_EVENTS:-50054}:${NAKAMOTO_LOCAL_EVENTS_PORT:-50054}"
    depends_on:
      sidecar:
        condition: service_healthy
  gl1:
    environment:
      # #196/#197: gl1 forwards DAG/AllowSpend/TokenLock blocks to gl0 via the
      # sidecar's libp2p mesh (replacing the prior single-peer HTTP POST). Same
      # SIDECAR_HOST format as gl0 — each gl1-N container colocates with sidecar-N
      # on the matching CONTAINER_NAME_SUFFIX so the gRPC call stays local-network.
      - SIDECAR_HOST=sidecar${CONTAINER_NAME_SUFFIX:-}
      - SIDECAR_GRPC_PORT=50051
      # gl1 follows gl0 + recomputes the historicalStakeSnapshots stateProof, so it needs the same
      # k₁. It runs as Dev too → resolves k₁=32 from application.conf's per-env block, matching gl0
      # by construction (verifier determinism). No env-var override needed.
    # NOTE: no `depends_on: sidecar` here — the `sidecar` service is in profile
    # `l0` (started by the gl0 launch), and adding a depends_on under the `l1`
    # profile would make compose error with "undefined service sidecar". The
    # compose-runner orchestrates startup order: gl0 (which brings sidecar)
    # finishes booting before gl1 launches.
