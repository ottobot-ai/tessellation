# Nakamoto mode overlay for the standard gl0 service.
#
# Layered in by compose-runner.sh alongside the sidecar overlay. The gl0 binary
# is Nakamoto-only — the run-nakamoto CLI command is selected by entrypoint.sh
# when NAKAMOTO_MODE=true. Tunables below configure LDD, sidecar, and genesis.
services:
  gl0:
    environment:
      # Signals entrypoint.sh to use `run-nakamoto` instead of BFT commands
      - NAKAMOTO_MODE=true
      # Coordinated genesis time — set per cluster by compose-runner.sh and
      # written into each per-node .env file. Every node MUST agree on this.
      - NAKAMOTO_GENESIS_TIME_MS=${NAKAMOTO_GENESIS_TIME_MS}
      - NAKAMOTO_GENESIS_ETA=tessellation-nakamoto-genesis
      # LDD snowplow tunables — production-aligned values (within rounding) so
      # the test cluster exercises the same eligibility curve as mainnet.
      # Earlier 2× test overrides (32/2/0.1/1.0) didn't actually speed up chain
      # growth — block production is wall-clock bound, not eligibility bound,
      # so doubling fA just changed the fill-rate metric without producing
      # snapshots faster.
      - NAKAMOTO_SLOTS_PER_EPOCH=${NAKAMOTO_SLOTS_PER_EPOCH:-60}
      # R = 100 snapshots for e2e (production default 2550 = 10·k₁). Violates the
      # R ≥ 3·k₁ bound but tests aren't adversarial; chosen to exercise rotation
      # mechanism many times per run. See `docs/nakamoto/attestation-and-finality.md` §1.3.
      - NAKAMOTO_ETA_ROTATION_SNAPSHOTS=${NAKAMOTO_ETA_ROTATION_SNAPSHOTS:-100}
      - NAKAMOTO_LDD_CUTOFF=${NAKAMOTO_LDD_CUTOFF:-16}
      - NAKAMOTO_LDD_OFFSET=${NAKAMOTO_LDD_OFFSET:-1}
      - NAKAMOTO_LDD_BASELINE=${NAKAMOTO_LDD_BASELINE:-0.05}
      - NAKAMOTO_LDD_AMPLITUDE=${NAKAMOTO_LDD_AMPLITUDE:-0.5}
      # Test-only slot duration. Production default is 1000ms (in SnapshotLeaderLoop).
      # Kept at 1000ms because halving slot duration also halves wall-clock per epoch
      # (slots-per-epoch is fixed at 60), which made the token-lock-replacement edge
      # cases flake — the WithdrawalTimeLimit window closes before the L1 syncs the
      # new lock. If we want faster slots we'd need to scale slots-per-epoch too.
      - NAKAMOTO_SLOT_DURATION_MS=${NAKAMOTO_SLOT_DURATION_MS:-1000}
      # Local sidecar gRPC endpoint — sidecar service runs on the same docker
      # network with the matching CONTAINER_NAME_SUFFIX.
      - SIDECAR_HOST=sidecar${CONTAINER_NAME_SUFFIX:-}
      - SIDECAR_GRPC_PORT=50051
    depends_on:
      sidecar:
        condition: service_healthy
  gl1:
    environment:
      # #196/#197: gl1 forwards DAG/AllowSpend/TokenLock blocks to gl0 via the
      # sidecar's libp2p mesh (replacing the prior single-peer HTTP POST). Same
      # SIDECAR_HOST format as gl0 — each gl1-N container colocates with sidecar-N
      # on the matching CONTAINER_NAME_SUFFIX so the gRPC call stays local-network.
      - SIDECAR_HOST=sidecar${CONTAINER_NAME_SUFFIX:-}
      - SIDECAR_GRPC_PORT=50051
    depends_on:
      sidecar:
        condition: service_healthy
