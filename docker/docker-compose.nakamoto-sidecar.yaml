# Nakamoto sidecar overlay for the standard `just test` infra.
#
# Adds a Go libp2p sidecar service alongside the gl0 service in each per-node
# compose file. Layered in by compose-runner.sh, which writes the per-node
# sidecar peer list into .env.
#
# The image is built locally from p2p/Dockerfile by compose-runner.sh; we
# tag it `nakamoto-sidecar:test` so all per-node compose files reuse the
# same image without re-building per node.
services:
  sidecar:
    image: nakamoto-sidecar:test
    container_name: sidecar${CONTAINER_NAME_SUFFIX:-}
    restart: unless-stopped
    # 2026-06-10 (run b28spqgci forensics): 384m was too small for long runs — sidecar memory grows with
    # uptime (gossip dedup/cache sets) and ALL five sidecars pinned at 99.9% of the cap ~50-70 min in.
    # With swap enabled (docker default memswap = 2x mem) the kernel SWAPPED the gossip layer instead of
    # OOMing: ~340 MB/s of swap churn, attestation latency through the roof, T_count finality dropping to
    # the depth-k rail, reorg density 4x — the late-run degradation seen across every long e2e. Bump the
    # default AND set memswap_limit == mem_limit so the sidecar fail-fast OOM-restarts (visible!) rather
    # than thrashing invisibly. Mirror the HOCON-default rule: keep the compose fallback non-empty.
    mem_limit: ${CL_SIDECAR_MEM_LIMIT:-1024m}
    memswap_limit: ${CL_SIDECAR_MEM_LIMIT:-1024m}  # == mem_limit ⇒ NO swap for the gossip layer
    command:
      - "-grpc"
      - "0.0.0.0:50051"
      - "-jvm-grpc"
      - "gl0${CONTAINER_NAME_SUFFIX:-}:50053"
      - "-listen"
      - "/ip4/0.0.0.0/tcp/9500"
      - "-seedlist"
      - "${NAKAMOTO_SIDECAR_SEEDLIST}"
      - "-key"
      - "/keys/sidecar.key"
      - "-disable-mdns"
    environment:
      # Go GC target just under the cgroup cap (mem_limit above) so the runtime collects
      # aggressively BEFORE the kernel intervenes — without this Go has no idea a cgroup
      # limit exists and grows heap straight into the cap (the 2026-06-10 swap-thrash).
      - GOMEMLIMIT=${CL_SIDECAR_GOMEMLIMIT:-900MiB}
      # Hierarchical shard-checkpoint sharding. The sidecar reads M so it can
      # EAGERLY join every shard's checkpoint + attestation GossipSub topic
      # (shards 0 .. M-1) at startup — in v1 the shard committee is the full
      # validator set, so every node must receive every shard's gossip even on
      # shards it never produces to. Mirrors the gl0 overlay's NAKAMOTO_NUM_SHARDS
      # plumbing so sidecar and JVM agree on M. num-shards = 1 (the default) keeps
      # the sidecar byte-identical to pre-sharding: NO startup shard-topic joins.
      # Default MUST mirror the gl0 overlay default (1).
      - NAKAMOTO_NUM_SHARDS=${NAKAMOTO_NUM_SHARDS:-1}
    volumes:
      - ./sidecar.key:/keys/sidecar.key:ro
    networks:
      - tessellation_common
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 2s
    profiles: ["l0"]
