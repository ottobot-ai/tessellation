# Nakamoto sidecar overlay for the standard `just test` infra.
#
# Adds a Go libp2p sidecar service alongside the gl0 service in each per-node
# compose file. Layered in by compose-runner.sh, which writes the per-node
# sidecar peer list into .env.
#
# The image is built locally from p2p/Dockerfile by compose-runner.sh; we
# tag it `nakamoto-sidecar:test` so all per-node compose files reuse the
# same image without re-building per node.
services:
  sidecar:
    image: nakamoto-sidecar:test
    container_name: sidecar${CONTAINER_NAME_SUFFIX:-}
    restart: unless-stopped
    mem_limit: ${CL_SIDECAR_MEM_LIMIT:-384m}  # Go libp2p sidecar — small; cap it too so nothing is unbounded
    command:
      - "-grpc"
      - "0.0.0.0:50051"
      - "-jvm-grpc"
      - "gl0${CONTAINER_NAME_SUFFIX:-}:50053"
      - "-listen"
      - "/ip4/0.0.0.0/tcp/9500"
      - "-seedlist"
      - "${NAKAMOTO_SIDECAR_SEEDLIST}"
      - "-key"
      - "/keys/sidecar.key"
      - "-disable-mdns"
    environment:
      # Hierarchical shard-checkpoint sharding. The sidecar reads M so it can
      # EAGERLY join every shard's checkpoint + attestation GossipSub topic
      # (shards 0 .. M-1) at startup — in v1 the shard committee is the full
      # validator set, so every node must receive every shard's gossip even on
      # shards it never produces to. Mirrors the gl0 overlay's NAKAMOTO_NUM_SHARDS
      # plumbing so sidecar and JVM agree on M. num-shards = 1 (the default) keeps
      # the sidecar byte-identical to pre-sharding: NO startup shard-topic joins.
      # Default MUST mirror the gl0 overlay default (1).
      - NAKAMOTO_NUM_SHARDS=${NAKAMOTO_NUM_SHARDS:-1}
    volumes:
      - ./sidecar.key:/keys/sidecar.key:ro
    networks:
      - tessellation_common
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 2s
    profiles: ["l0"]
