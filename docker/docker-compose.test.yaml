services:
  gl0:
    # NET_ADMIN required for tc-based network isolation in fork recovery tests
    cap_add:
      - NET_ADMIN
    environment:
      # Consensus timing overrides — HOCON ${?VAR} in conf files reads these.
      # Set in CI workflow to give slow runners more breathing room.
      # Using bare VAR form (no =) so Docker Compose only passes them when
      # they are actually set in the host environment (omits when unset).
      # HOCON ${?VAR} fails to parse empty strings, so never pass empty values.
      - CL_DECLARATION_TIMEOUT
      - CL_RE_STALL_TIMEOUT
      - CL_TIME_TRIGGER_INTERVAL
      - CL_MAX_ROUND_DURATION
      - CL_EVENT_TRIGGER_COOLDOWN
    # merge in an extra network just for tests
    networks:
      tessellation_common:
        aliases:
          - gl0${CONTAINER_NAME_SUFFIX:-}
        # Per-node IP computed ARITHMETICALLY in docker-env-setup.sh
        # (CL_DOCKER_GL0_IPV4 = ${NET_PREFIX}.(GL0_IP_BASE+i)) so the hypergraph
        # scales past 9 nodes. Falls back to the legacy "${NET_PREFIX}.1${offset}"
        # string form (byte-identical for offset<10) when CL_DOCKER_GL0_IPV4 is
        # unset (single-node / non-Nakamoto paths).
        ipv4_address: ${CL_DOCKER_GL0_IPV4:-${NET_PREFIX}.1${CONTAINER_OFFSET:-0}}
  gl1:
    # merge in an extra network just for tests
    networks:
      tessellation_common:
        aliases:
          - gl1${CONTAINER_NAME_SUFFIX:-}
        # Per-node IP computed ARITHMETICALLY in docker-env-setup.sh
        # (CL_DOCKER_GL1_IPV4 = ${NET_PREFIX}.(GL1_IP_BASE+i), GL1_IP_BASE=30).
        # Fallback must mirror that .3X base (NOT the legacy .2X) — entrypoint.sh
        # advertises CL_DOCKER_GL1_IPV4, so a stale .2X bind would NoRouteToHost.
        ipv4_address: ${CL_DOCKER_GL1_IPV4:-${NET_PREFIX}.3${CONTAINER_OFFSET:-0}}
# declare the external network (must already exist)
networks:
  tessellation_common:
    external: true
