syntax = "proto3";

package nakamoto.p2p;

option go_package = "github.com/scasplte2/tessellation/p2p/proto";
option java_package = "io.constellationnetwork.node.shared.infrastructure.consensus.nakamoto.proto";

// ─── Messages ────────────────────────────────────────────────────────

// A snapshot produced by a slot winner, broadcast via GossipSub.
//
// Fields 11-12 added by #56.8 (ChainSync state-query disposition):
//   - `finalized=true` ⇒ snapshot is on the canonical chain at an ordinal ≤ chainStore's
//     last finalized ordinal. Consumers may cache aggressively and treat as authoritative.
//   - `finalized=false` ⇒ snapshot is on a pending branch and may be reorged out.
//     `branch_id` carries the branch identifier so consumers can correlate provisional
//     fetches across requests.
//   - For gossip-broadcast snapshots (publishing path), `finalized=false` and `branch_id`
//     is the snapshot's own hash — every newly-produced snapshot is provisional.
//   - For "not found" responses on the ServeSnapshots/FetchSnapshots RPC, the server
//     simply omits the snapshot from the stream (existing behavior, unchanged).
//
// The Go sidecar treats `payload` as opaque bytes and is unaffected by these additions
// — proto3 forward-compat skips unknown fields. JVM-side parsers populate the disposition
// when serving and read it when fetching (see `ChainSyncStateResponse`).
message Snapshot {
  bytes hash = 1;           // 32 bytes, snapshot hash
  int64 slot = 2;           // slot number
  int64 ordinal = 3;        // snapshot ordinal
  bytes parent_hash = 4;    // 32 bytes, parent snapshot hash
  bytes vrf_proof = 5;      // 80 bytes, VRF proof (Gamma || c || s)
  bytes vrf_public_key = 6; // 32 bytes, Ed25519 VRF public key
  bytes eta = 7;            // 32 bytes, epoch randomness
  bytes payload = 8;        // serialized snapshot body (opaque to sidecar)
  bytes producer_id = 9;    // peer identity of the producer
  int64 parent_slot = 10;   // slot of parent snapshot (for slot gap verification)
  bool finalized = 11;      // ChainSync disposition (#56.8): true ⇒ on canonical chain at finalized ordinal
  bytes branch_id = 12;     // ChainSync disposition (#56.8): pending branch id when finalized=false
  // KES product signature over the same bytes that `signature` covers (the
  // snapshot artifact hash for Snapshot). Empty when sender pre-dates the §1.2
  // KES rollout — receiver tolerates empty (Slice 5 makes verification
  // warn-only). Added in §1.2 Slice 4.
  bytes kes_signature = 13;
}

// A validator's endorsement of a chain tip.
message TipAttestation {
  bytes tip_hash = 1;       // 32 bytes, hash of endorsed snapshot
  int64 tip_slot = 2;       // slot of that snapshot
  int64 tip_ordinal = 3;    // ordinal of that snapshot
  int64 attested_at = 4;    // slot when attestation was created
  bytes attester_id = 5;    // peer identity of the attester
  bytes signature = 6;      // signature over (tip_hash || tip_slot)
  // KES product signature over the same bytes that `signature` covers (the
  // attestation hash for TipAttestation). Empty when sender pre-dates the §1.2
  // KES rollout — receiver tolerates empty (Slice 5 makes verification
  // warn-only). Added in §1.2 Slice 4.
  bytes kes_signature = 7;
}

// A generic signed rumor — used to carry events, BFT consensus messages,
// and other Tessellation gossip payloads on top of GossipSub. The sidecar
// treats the body as opaque bytes; the JVM is responsible for serialization,
// signing, and validation.
message Rumor {
  // Signed rumor envelope, JSON-serialized by the JVM and wrapped in the
  // standard Tessellation `Signed[RumorRaw]` shape. Opaque to the sidecar.
  bytes signed_rumor_bytes = 1;
  // Content type discriminator (e.g. "io.constellationnetwork...Event").
  // Carried alongside the bytes for cheap routing/metrics on the sidecar.
  string content_type = 2;
  // Origin peer id (for logging/dedup hints — authoritative origin is in the
  // signed envelope).
  bytes origin_id = 3;
}

// A state channel snapshot binary produced by a metagraph CL0, broadcast
// to all GL0 nodes via GossipSub. Replaces the HTTP POST path that suffered
// from retry-cap starvation under transient rejections. The sidecar treats
// the binary bytes as opaque; the JVM serializes Signed[StateChannelSnapshotBinary]
// the same way the HTTP path does (JsonBrotliBinarySerializer).
message MetagraphBinary {
  // Metagraph address (DAG base58 string).
  string address = 1;
  // Signed[StateChannelSnapshotBinary] bytes, opaque to the sidecar.
  bytes binary = 2;
}

// AllowSpend block produced by a metagraph dl1, broadcast to all GL0 nodes via
// GossipSub. Replaces the single-peer HTTP POST path from `Swap.sendBlockToL0`
// (task #196: lottery to one gl0 peer hits unhealthy nodes in reorg-recovery
// and drops the block). The sidecar treats the payload as opaque; the JVM
// serializes Signed[AllowSpendBlock] via the project JsonSerializer.
message AllowSpendBlock {
  // Signed[AllowSpendBlock] bytes, opaque to the sidecar.
  bytes payload = 1;
}

// DAG block produced by a dl1 validator, broadcast to all GL0 nodes via
// GossipSub. Extends the #196 durable-outbox pattern (#196 wired
// AllowSpendBlock; this is the same shape for the DAG-block hop). Replaces
// the single-peer HTTP POST path from `StateChannel.sendBlockToL0`
// (`p2pClient.l0BlockOutputClient.sendL1Output` → POST `/dag/l1-output`).
// Opaque payload: the JVM serializes `Signed[Block]` via the project
// JsonSerializer.
message DAGBlock {
  // Signed[Block] bytes, opaque to the sidecar.
  bytes payload = 1;
}

// TokenLock block produced by a dl1 validator, broadcast to all GL0 nodes via
// GossipSub. Same shape as DAGBlock + AllowSpendBlock — replaces the
// single-peer HTTP POST path from `TokenLock.sendBlockToL0`
// (`p2pClient.l0BlockOutputClient.sendTokenLockBlock` → POST
// `/dag/l1-token-lock-output`). Opaque payload: the JVM serializes
// `Signed[TokenLockBlock]` via the project JsonSerializer.
message TokenLockBlock {
  // Signed[TokenLockBlock] bytes, opaque to the sidecar.
  bytes payload = 1;
}

// Per-metagraph committee attestation (Slice S2, task #188).
//
// Emitted by a gl0 operator key that wins the committee VRF for a given
// (metagraph_address, parent_hash) under the per-metagraph sortition
// (`docs/nakamoto/COMMITTEE-SORTITION-DESIGN.md`). The receiver resolves the
// sender's exact active preregistered KES+VRF pair from canonical historical
// state, requires any carried VK to match, and verifies the VRF proof under the
// resolved VK plus the threshold `K · σ`, then
// tallies toward the per-binary `≥ 2K/3` quorum. Slice S3 will flip the
// aggregate from warn-only observability into the load-bearing pre-inclusion
// gate that lets non-committee operators skip the binary entirely.
//
// `parent_hash` is the metagraph's lastSnapshotHash — the parent pointer of
// the binary being attested. Keying on the parent (not the ordinal) means two
// competing binaries on the same fork point share one VRF input; a committee
// member that signs both is detectably equivocating (slashing-condition
// substrate, S4). UTF-8 of the canonical hex Hash representation; matches the
// JVM-side `Hash.getBytes` form used to build `CommitteeVrfInput`.
//
// `binary_hash` ties the attestation to a specific MetagraphBinary so we don't
// double-count attestations across competing binaries on the same parent.
//
// `kes_signature` covers the same bytes as `signature` and follows the same
// Slice 9 verify path used for TipAttestation. Empty during the warn-only
// window (S2); receiver-side enforcement turns on in S3.
message MetagraphAttestation {
  bytes peer_id = 1;             // operator's long-term peer id
  string metagraph_address = 2;  // DAG base58 string; subject metagraph
  bytes parent_hash = 3;         // metagraph snapshot parent hash (UTF-8 of canonical Hash hex)
  bytes binary_hash = 4;         // 32 bytes; hash of the MetagraphBinary
  bytes committee_vrf_proof = 5; // committee VRF proof — gates membership
  bytes signature = 6;           // long-term-key signature over the canonical bytes
  bytes kes_signature = 7;       // Required KES product signature over the same canonical bytes as `signature`.
  bytes vrf_public_key = 8;      // sender-carried committee VRF VK (32 bytes), used only as comparison evidence.
                                 // The receiver resolves the exact active preregistered KES+VRF pair from canonical
                                 // historical registry state, requires byte equality, and verifies the proof under
                                 // that resolved key. A missing, pending, stale, or mismatched pair fails closed.
  uint32 sender_tree_step = 9;   // Sender-carried comparison evidence only. The receiver resolves the atomic
                                 // preregistered KES+VRF pair for the artifact period, derives the required step
                                 // as `artifact_period - registered_offset`, requires exact equality here, and
                                 // verifies under that derived key. The wire value never selects a KES key or era.
}

// ─── Hierarchical-shard-checkpoints v1 — Slice 14 wire format ───────
//
// Shard checkpoint envelope. Mirrors the Scala
// `io.constellationnetwork.schema.sharding.ShardCheckpoint` shape (Slice 1).
// Produced by a shard committee member (Slice 8 `ShardCheckpointProducer`)
// and gossipped on per-shard topic `shard-checkpoint-<shardId>` so non-shard
// gl0 operators can shed the network load (design doc §6.4).
//
// Wire-format conventions follow existing project patterns:
//   - `parent_checkpoint_hash` / `checkpoint_hash`: UTF-8 of the canonical
//     `Hash` hex string — matches `MetagraphAttestation.parent_hash` /
//     `Snapshot.hash` and the JVM-side `Hash.getBytes` (UTF-8) decode form.
//   - `ShardDerivedStateDeltaWire.payload_json` is opaque JSON serialized via
//     the project `JsonSerializer`
//     (deterministic — sortKeys + dropNullValues per `JsonSerializer.forAsync`).
//     Mirrors `MetagraphBinary.binary` / `AllowSpendBlock.payload` pattern:
//     the sidecar treats these as opaque bytes; only the JVM serializes /
//     deserializes via Circe. Keeps the proto schema stable across schema
//     evolutions of the inner Scala types.
//   - `committee_signatures` carry fields directly (not opaque) because gl0
//     acceptance (`ShardCheckpointGl0AcceptanceManager`, Slice 9) needs them
//     in a structured form for VRF + Ed25519 + KES verification.
//
// Greenfield rule: no legacy decoder. The complete current field set is
// mandatory at the JVM boundary. The sig pre-image is the schema-side
// `ShardCheckpointSigPreimage`, not these transport bytes.
message ShardCheckpointWire {
  uint32 shard_id = 1;
  uint64 shard_ordinal = 2;
  bytes parent_checkpoint_hash = 3;      // UTF-8 of canonical Hash hex
  uint64 gl0_anchor_ordinal = 4;
  uint64 epoch = 5;
  ShardDerivedStateDeltaWire derived_state_delta = 6;
  repeated CommitteeMemberSignatureWire committee_signatures = 7;
  uint64 slot = 8;                       // wall-clock slot of the scheduled producer duty
  uint64 execution_base_ordinal = 9;     // ordinal of the claimed exact GL0 state used for CL1 replay
  bytes execution_base_hash = 10;        // UTF-8 canonical snapshot hash hex
  bytes execution_base_parent_hash = 11; // UTF-8 canonical parent hash hex
  bytes execution_base_mpt_root = 12;    // UTF-8 canonical committed MPT root hex
}

// `ShardDerivedStateDelta` carried as opaque JSON bytes. The inner type has
// nested signed state-channel binaries and per-MG MPT subtree roots.
// Field-by-field re-implementation in proto would double the schema surface for
// zero gain — the bytes that
// committee members signed are the JSON-encoded `ShardCheckpointSigPreimage`
// (`Hasher[F].hash` of the Circe-encoded case class), so JSON IS the
// authoritative encoding regardless. The wire just transports the bytes.
//
// Carrying as a single bytes field (rather than per-section) keeps the codec
// path minimal and avoids drift between the wire's section decomposition and
// the Scala case-class field set when Slice 9/13 adds new derivations.
message ShardDerivedStateDeltaWire {
  bytes payload_json = 1;                // JSON bytes of ShardDerivedStateDelta via JsonSerializer
}

// One committee member's signature contribution. Mirrors
// `io.constellationnetwork.schema.sharding.CommitteeMemberSignature` (Slice 1).
// All three signatures (VRF + Ed25519 + KES product) are independently
// load-bearing — see the Scala case class scaladoc for the rationale on why
// they are not wrapped in an outer `Signed[_]` envelope.
//
// `peer_id` is UTF-8 of the Hex string carrying the PeerId's underlying hex
// (matches the existing `MetagraphAttestation.peer_id` decode pattern, which
// hex-encodes the raw bytes back). Receiver: `Hex(peer_id.toByteArray.map(...))`.
message CommitteeMemberSignatureWire {
  bytes peer_id = 1;                     // raw bytes; receiver hex-encodes back to PeerId.value
  bytes vrf_proof = 2;                   // raw VRF proof bytes
  bytes ed25519_sig = 3;                 // raw Ed25519 signature bytes
  bytes kes_product_sig = 4;             // raw KES product signature bytes
  uint32 kes_tree_step = 5;              // KES tree-internal step the sender used (non-interactive verify)
}

// Attestation by a committee member who did NOT produce the checkpoint but is
// signing off on it after observing it on the gossip path. Mirrors how a
// non-producing committee member attests to a metagraph binary in Slice S2/S3
// (`pb.MetagraphAttestation`). The attestation references the checkpoint by
// hash (UTF-8 of the canonical `ShardCheckpointSigPreimage` `Hasher[F]` hex);
// the receiver looks up the checkpoint envelope by hash + verifies the attester
// signature, then tallies toward the per-checkpoint `≥ ⌈2/3 K_S⌉` quorum.
//
// `shard_id` is on the wire (despite being derivable from the checkpoint) so
// gossip-layer routing can dispatch to the right per-shard handler without
// requiring the checkpoint to be available locally first.
message ShardCheckpointAttestationWire {
  uint32 shard_id = 1;
  bytes checkpoint_hash = 2;             // UTF-8 of canonical Hasher[F] of ShardCheckpointSigPreimage
  CommitteeMemberSignatureWire attester_signature = 3;
}

// ─── WATCHTOWER fraud-proof wire format ─────────────────────────────
//
// A non-committee gl0 node's challenge to a quorum-signed shard checkpoint
// whose attested per-MG derivation it could not reproduce. Mirrors the Scala
// `io.constellationnetwork.schema.sharding.FraudProofEnvelope` (a small
// fixed-field message — all fields are structured, no opaque JSON, because the
// dispute consumer needs them typed to recompute the verdict). Gossipped on the
// gl0-wide `fraud-proof` topic so EVERY gl0 receives + independently re-runs the
// deterministic verdict (WATCHTOWER-FRAUD-PROOF-DESIGN.md §10.2).
//
// Wire-format conventions follow the existing patterns:
//   - Hash / hex fields: UTF-8 of the canonical hex (`Hash.getBytes`), matching
//     `ShardCheckpointAttestationWire.checkpoint_hash`.
//   - `submitter_id`: raw PeerId bytes (receiver hex-encodes back), matching
//     `CommitteeMemberSignatureWire.peer_id`.
//   - sig/witness fields: raw bytes (`.toBytes` / `Hex.fromBytes`).
//
// Greenfield: field set/numbers pinned to v1; add `FraudProofEnvelopeWire2` to
// evolve rather than mutating in place.
message FraudProofEnvelopeWire {
  uint32 shard_id = 1;
  bytes disputed_checkpoint_hash = 2;    // UTF-8 of canonical Hasher[F] of ShardCheckpointSigPreimage
  string metagraph_address = 3;          // DAG base58 string
  uint64 gl0_anchor_ordinal = 4;
  bytes claimed_derivation = 5;          // UTF-8 of committee-attested per-MG root hex (hint, untrusted)
  bytes challenger_derivation = 6;       // UTF-8 of challenger's honest reference root hex (hint, untrusted)
  bytes reexecution_witness = 7;         // raw witness bytes
  bytes challenger_signature = 8;        // raw Ed25519 over FraudProofSigPreimage
  bytes submitter_id = 9;                // raw PeerId bytes; receiver hex-encodes back
}

// Envelope for GossipSub messages.
message GossipMessage {
  oneof body {
    Snapshot snapshot = 1;
    TipAttestation attestation = 2;
    Rumor rumor = 3;
    MetagraphBinary metagraph_binary = 4;
    MetagraphAttestation metagraph_attestation = 5;
    AllowSpendBlock allow_spend_block = 6;
    DAGBlock dag_block = 7;
    TokenLockBlock token_lock_block = 8;
    ShardCheckpointWire shard_checkpoint = 9;                  // Slice 14
    ShardCheckpointAttestationWire shard_checkpoint_attestation = 10;  // Slice 14
    FraudProofEnvelopeWire fraud_proof = 11;                   // WATCHTOWER fraud-proof
    SubscribeStarted started = 12;
  }
}

// Declares which colocated JVM subsystem owns a Subscribe stream. This is
// lifecycle metadata only: a role grants no network or consensus authority.
enum SubscriberRole {
  SUBSCRIBER_ROLE_UNSPECIFIED = 0;
  SUBSCRIBER_ROLE_RUMOR_BRIDGE = 1;
  SUBSCRIBER_ROLE_NAKAMOTO_SYNC = 2;
}

// The mandatory first Subscribe event. It proves only that this sidecar
// process acquired the requested local GossipSub subscriptions and shared
// channel drain leases. It does not assert peer connectivity, mesh membership,
// retained history, message freshness, or consensus readiness.
message SubscribeStarted {
  repeated string topics = 1;       // Exact validated labels, deduplicated in canonical order.
  SubscriberRole role = 2;
  uint64 stream_generation = 3;     // Monotonic within sidecar_session_id.
  string sidecar_session_id = 4;    // Random identifier fixed for this sidecar process.
}

// ─── gRPC Service: JVM ↔ Sidecar ────────────────────────────────────

// The sidecar exposes this service on localhost for the JVM to call.
service SidecarService {
  // Publish a snapshot to the network (JVM won a slot).
  rpc PublishSnapshot(Snapshot) returns (PublishResponse);

  // Publish an attestation to the network.
  rpc PublishAttestation(TipAttestation) returns (PublishResponse);

  // Publish a generic rumor (event / BFT consensus message / etc).
  rpc PublishRumor(Rumor) returns (PublishResponse);

  // Publish a metagraph state channel snapshot binary to all GL0 nodes.
  rpc PublishMetagraphBinary(MetagraphBinary) returns (PublishResponse);

  // Publish a per-metagraph committee attestation to all GL0 nodes (Slice S2).
  rpc PublishMetagraphAttestation(MetagraphAttestation) returns (PublishResponse);

  // Publish an AllowSpendBlock to all GL0 nodes via the durable outbox path
  // (task #196: replaces the single-peer HTTP POST from Swap.sendBlockToL0).
  rpc PublishAllowSpendBlock(AllowSpendBlock) returns (PublishResponse);

  // Publish a DAG block to all GL0 nodes via the durable outbox path. Replaces
  // the single-peer HTTP POST from `StateChannel.sendBlockToL0`. Same durable-
  // outbox machinery as #196 — the sidecar re-publishes on a ticker until the
  // JVM acks Phase-3 finality via `ConfirmFinalized`.
  rpc PublishDAGBlock(DAGBlock) returns (PublishResponse);

  // Publish a TokenLockBlock to all GL0 nodes via the durable outbox path.
  // Replaces the single-peer HTTP POST from `TokenLock.sendBlockToL0`. Same
  // durable-outbox machinery as #196 / PublishAllowSpendBlock.
  rpc PublishTokenLockBlock(TokenLockBlock) returns (PublishResponse);

  // Publish a raw shard checkpoint to `shard-checkpoint-<shardId>`. The current
  // transitional sidecar eagerly joins every GL0 to every configured shard;
  // target transport must restrict this raw lane to the exact current execution
  // and watchtower assignments. A distinct GL0-wide execution-certified
  // checkpoint/diff lane for ordinary noncommittee adoption is still required
  // and is not implemented by this RPC.
  rpc PublishShardCheckpoint(ShardCheckpointWire) returns (PublishResponse);

  // Publish an execution-committee signature by a non-producing member on the
  // per-shard attestation topic. Every signer must independently replay the
  // exact ordered framework inputs and reproduce the checkpoint result before
  // signing. Validity requires the configured distinct `kQuorum`; shard depth or
  // a legacy ceil(2*K_S/3) count cannot substitute for replay signatures.
  rpc PublishShardCheckpointAttestation(ShardCheckpointAttestationWire) returns (PublishResponse);

  // WATCHTOWER: publish a fraud proof on the gl0-wide `fraud-proof` topic. EVERY
  // gl0 receives it and independently re-runs the deterministic verdict over the
  // disputed checkpoint's own bytes (WATCHTOWER-FRAUD-PROOF-DESIGN.md §10.2).
  rpc PublishFraudProof(FraudProofEnvelopeWire) returns (PublishResponse);

  // JVM tells sidecar that the listed message_ids on `topic` reached Phase-3
  // finality. The sidecar drops the corresponding outbox entries; until this
  // call arrives the outbox keeps republishing them periodically. Idempotent
  // — unknown ids are silently ignored. See task #196.
  rpc ConfirmFinalized(ConfirmFinalizedRequest) returns (ConfirmFinalizedResponse);

  // Subscribe to incoming messages from the network. The first response is
  // always GossipMessage.started and later responses are typed deliveries.
  rpc Subscribe(SubscribeRequest) returns (stream GossipMessage);

  // Get connected peer count.
  rpc PeerCount(PeerCountRequest) returns (PeerCountResponse);

  // Health check.
  rpc Health(HealthRequest) returns (HealthResponse);
}

message PublishResponse {
  bool ok = 1;
  string error = 2;
}

message SubscribeRequest {
  // Which message families to receive — one label per GossipMessage.body arm:
  //   "snapshot", "attestation", "rumor", "metagraph-binary",
  //   "metagraph-attestation", "allow-spend-block", "dag-block",
  //   "token-lock-block", "shard-checkpoint", "shard-checkpoint-attestation",
  //   "fraud-proof"
  // The set must be explicit and nonempty. Unknown labels FAIL the stream
  // (InvalidArgument) — a typo must not silently subscribe to nothing.
  //
  // FINDING-F1: the filter is load-bearing for the shard-checkpoint families,
  // which ride SHARED node-lifetime fan-in channels tolerating exactly ONE
  // drainer. The JVM's two streams declare disjoint sets (the rumor bridge
  // takes "rumor"; the NakamotoSyncDaemon takes the exact active non-rumor
  // profile) so the shard channels get exactly one drainer by construction.
  // Labels mirror SidecarClient.SubscribeTopics (JVM) / grpcserver.Topic* (Go).
  repeated string topics = 1;

  // Required owner of this stream. The sidecar echoes the validated role in
  // SubscribeStarted so a reconnect cannot be confused with another consumer.
  SubscriberRole role = 2;
}

message PeerCountRequest {}

message PeerCountResponse {
  int32 total = 1;
  int32 mesh_snapshots = 2;              // peers in snapshot topic mesh
  int32 mesh_attestations = 3;           // peers in attestation topic mesh
  int32 mesh_rumors = 4;                 // peers in rumor topic mesh
  int32 mesh_metagraph_binaries = 5;     // peers in metagraph binary topic mesh
  int32 mesh_metagraph_attestations = 6; // peers in metagraph attestation topic mesh (Slice S2)
  int32 mesh_allow_spend_blocks = 7;     // peers in allow-spend-block topic mesh (#196)
  int32 mesh_dag_blocks = 8;             // peers in dag-block topic mesh (#196 follow-up)
  int32 mesh_token_lock_blocks = 9;      // peers in token-lock-block topic mesh (#196 follow-up)
  int32 mesh_shard_checkpoints = 10;     // peers in shard-checkpoint topic mesh (Slice 14) — aggregate across shards
  int32 mesh_shard_checkpoint_attestations = 11;  // peers in shard-checkpoint-attestation topic mesh (Slice 14)
}

// ConfirmFinalized request: drop outbox entries for the given message ids on
// the named topic. Used by the JVM Phase-3 finality hook to ack durable-outbox
// delivery. Sent in batches at finalize time.
message ConfirmFinalizedRequest {
  // Topic the message_ids belong to (e.g. "allow-spend-block", "dag-block",
  // "token-lock-block", "metagraph-binary", "metagraph-attestation").
  string topic = 1;
  // Message ids previously assigned by the sidecar on Publish; each is the
  // first 32 bytes of sha256(payload). Unknown ids are ignored.
  repeated bytes message_ids = 2;
}

message ConfirmFinalizedResponse {
  // Number of outbox entries actually dropped. 0 if all ids were unknown.
  int32 dropped = 1;
}

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  int64 uptime_seconds = 2;
  int32 peer_count = 3;
}

// ─── ChainSync: Active Parent Fetching ──────────────────────────────
// Request-response protocol for fetching missing chain segments from peers.
// Inspired by Bitcoin (hash-based walk-back), Cardano (intersection finding),
// Polkadot (libp2p stream protocol), Ethereum (batch fetching).

// A point on a chain, used for intersection finding.
message ChainPoint {
  bytes hash = 1;
  int64 ordinal = 2;
}

// Request specific snapshots by hash (up to 64 per request).
message FetchSnapshotsRequest {
  repeated bytes hashes = 1;
}

// Find the most recent common ancestor between two chains.
// Client sends sparse chain points (e.g. tip, tip-1, tip-2, tip-4, tip-8, ...genesis).
message FindIntersectionRequest {
  repeated ChainPoint points = 1;
}

message FindIntersectionResponse {
  bool found = 1;
  bytes intersection_hash = 2;
  int64 intersection_ordinal = 3;
  bytes tip_hash = 4;       // responder's current best tip
  int64 tip_ordinal = 5;
}

message GetPeerTipRequest {}

message PeerTipResponse {
  bytes hash = 1;
  int64 ordinal = 2;
  int64 slot = 3;
}

message ServeSnapshotsRequest {
  repeated bytes hashes = 1;
}

message ServeChainPointsRequest {}

message ServeChainPointsResponse {
  repeated ChainPoint points = 1;
  bytes tip_hash = 2;
  int64 tip_ordinal = 3;
}

// ─── ChainSync: Metagraph-binary active recovery (#259) ──────────────
//
// Active pull of a missing metagraph state-channel binary by VALUE-hash.
// Mirrors the FetchSnapshots/ServeSnapshots templates above. When a gl0
// orphan buffer has a parent un-admitted past a timeout, the stuck-detection
// tick pulls the missing binary by its value-hash from a peer over the SAME
// /nakamoto/chainsync/1.0.0 protocol, then re-feeds it through the normal
// committee-gate admission path (NEVER trust-on-fetch — the re-fed binary is
// re-validated by the gate).
//
// `binary_hashes` are VALUE-hashes (`Signed[StateChannelSnapshotBinary]`
// `toHashed.hash` / `signed.value.hash`) — the SAME identity the orphan
// buffer keys on and gl0 writes into `lastStateChannelSnapshotHashes`. They
// are NOT wire-bytes digests. On the wire each is UTF-8 of the canonical Hash
// hex string (matching `FetchSnapshotsRequest.hashes` / `Snapshot.hash` /
// `MetagraphAttestation.parent_hash`, all `Hash.getBytes` UTF-8 form), so the
// JVM decode is `Hash(new String(bytes, UTF_8))`.
message FetchMetagraphBinariesRequest {
  string metagraph_address = 1;     // DAG base58 string; subject metagraph
  repeated bytes binary_hashes = 2; // value-hashes; UTF-8 of canonical Hash hex
}

// One served metagraph binary. `signed_binary` is exactly
// `JsonSerializer[F].serialize(signed)` of the matched
// `Signed[StateChannelSnapshotBinary]` — byte-identical to the gossip path
// (StateChannelRoutes.broadcastMetagraphBinary), so the re-feed
// (`handleMetagraphBinary` → `processBytes`) deserializes it the same way a
// fresh gossip arrival would.
message MetagraphBinaryResponse {
  bytes signed_binary = 1;          // JsonSerializer bytes of Signed[StateChannelSnapshotBinary]
}

// JVM → Sidecar: request chain data from the network.
// The sidecar picks a peer, opens a libp2p stream, relays the request,
// and streams the response back to the JVM.
service ChainSyncOutbound {
  rpc FetchSnapshots(FetchSnapshotsRequest) returns (stream Snapshot);
  rpc FindIntersection(FindIntersectionRequest) returns (FindIntersectionResponse);
  rpc GetPeerTip(GetPeerTipRequest) returns (PeerTipResponse);
  // #259: pull missing metagraph binaries by value-hash from a peer.
  rpc FetchMetagraphBinaries(FetchMetagraphBinariesRequest) returns (stream MetagraphBinaryResponse);
}

// Sidecar → JVM: serve local chain data to incoming network requests.
// When a peer asks our sidecar for snapshots, the sidecar calls these
// methods on the JVM to fulfill the request.
service ChainSyncInbound {
  rpc ServeSnapshots(ServeSnapshotsRequest) returns (stream Snapshot);
  rpc ServeChainPoints(ServeChainPointsRequest) returns (ServeChainPointsResponse);
  // #259: serve local metagraph binaries (recent-finalized snapshots +
  // non-destructive orphan-buffer peek) to an incoming network request.
  rpc ServeMetagraphBinaries(FetchMetagraphBinariesRequest) returns (stream MetagraphBinaryResponse);
}
