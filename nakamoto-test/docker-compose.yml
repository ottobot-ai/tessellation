# Nakamoto PoC local cluster — 3 JVM nodes + 3 Go sidecars
# All nodes run `run-nakamoto` with shared genesis key → identical genesis → simultaneous Ready.
#
# Usage:
#   1. Build JARs:  sbt dagL0/stage
#   2. Start:  docker compose up --build

x-jvm-common: &jvm-common
  build:
    context: ..
    dockerfile: nakamoto-test/Dockerfile.jvm
  environment: &jvm-env
    CL_APP_ENV: dev
    NAKAMOTO_ENABLED: "true"
    NAKAMOTO_PURE: "true"
    NAKAMOTO_GENESIS_ETA: "tessellation-nakamoto-genesis"
    NAKAMOTO_SLOTS_PER_EPOCH: "60"
    NAKAMOTO_ETA_ROTATION_SLOTS: "${NAKAMOTO_ETA_ROTATION_SLOTS:-600}"
    # LDD params (override for testing, defaults: cutoff=15, offset=1, baseline=0.05, amplitude=0.5)
    NAKAMOTO_LDD_CUTOFF: "${NAKAMOTO_LDD_CUTOFF:-15}"
    NAKAMOTO_LDD_OFFSET: "${NAKAMOTO_LDD_OFFSET:-1}"
    NAKAMOTO_LDD_BASELINE: "${NAKAMOTO_LDD_BASELINE:-0.05}"
    NAKAMOTO_LDD_AMPLITUDE: "${NAKAMOTO_LDD_AMPLITUDE:-0.5}"
    # Genesis time: set dynamically by start.sh, or use 0 for "now"
    # All nodes MUST share the same genesis time for slot agreement
    NAKAMOTO_GENESIS_TIME_MS: "${NAKAMOTO_GENESIS_TIME_MS:-0}"
    CL_KEYALIAS: alias
    CL_PASSWORD: password
    JAVA_OPTS: "-Xmx1g -Xss256k --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.security=ALL-UNNAMED"
  volumes:
    - ./genesis.csv:/opt/genesis.csv:ro
    - ./seedlist.csv:/opt/seedlist.csv:ro


x-sidecar-common: &sidecar-common
  build:
    context: ../p2p
    dockerfile: Dockerfile

x-nakamoto-cmd: &nakamoto-cmd
  # All nodes run the same command — no genesis/validator distinction.
  # Each signs genesis with own key; hash is over unsigned content so they agree.
  command: >
    run-nakamoto
    /opt/genesis.csv
    --collateral 0

services:
  # ── Node 0 ────────────────────────────────────────────
  sidecar-0:
    <<: *sidecar-common
    container_name: nakamoto-sidecar-0
    command: [
      "-grpc", "0.0.0.0:50051",
      "-listen", "/ip4/0.0.0.0/tcp/9500",
      "-seedlist", "/dns4/nakamoto-sidecar-1/tcp/9500,/dns4/nakamoto-sidecar-2/tcp/9500"
    ]
    networks:
      nakamoto:
        aliases: [sidecar-0]

  node-0:
    <<: *jvm-common
    container_name: nakamoto-node-0
    environment:
      <<: *jvm-env
      CL_KEYSTORE: /opt/keys/key.p12
      SIDECAR_HOST: sidecar-0
      SIDECAR_GRPC_PORT: "50051"
      CL_PUBLIC_HTTP_PORT: "9000"
      CL_P2P_HTTP_PORT: "9001"
      CL_CLI_HTTP_PORT: "9002"
    volumes:
      - ./genesis.csv:/opt/genesis.csv:ro
      - ./seedlist.csv:/opt/seedlist.csv:ro
      - ../docker/config/local-test-keys/3:/opt/keys:ro
    command: >
      run-nakamoto
      /opt/genesis.csv
      --ip node-0
      --public-port 9000
      --p2p-port 9001
      --cli-port 9002
      --seedlist /opt/seedlist.csv
      --collateral 0
    ports:
      - "9000:9000"
      - "9002:9002"
    depends_on:
      - sidecar-0
    networks:
      nakamoto:
        aliases: [node-0]

  # ── Node 1 ────────────────────────────────────────────
  sidecar-1:
    <<: *sidecar-common
    container_name: nakamoto-sidecar-1
    command: [
      "-grpc", "0.0.0.0:50051",
      "-listen", "/ip4/0.0.0.0/tcp/9500",
      "-seedlist", "/dns4/nakamoto-sidecar-0/tcp/9500,/dns4/nakamoto-sidecar-2/tcp/9500"
    ]
    networks:
      nakamoto:
        aliases: [sidecar-1]

  node-1:
    <<: *jvm-common
    container_name: nakamoto-node-1
    environment:
      <<: *jvm-env
      CL_KEYSTORE: /opt/keys/key.p12
      SIDECAR_HOST: sidecar-1
      SIDECAR_GRPC_PORT: "50051"
      CL_PUBLIC_HTTP_PORT: "9010"
      CL_P2P_HTTP_PORT: "9011"
      CL_CLI_HTTP_PORT: "9012"
    volumes:
      - ./genesis.csv:/opt/genesis.csv:ro
      - ./seedlist.csv:/opt/seedlist.csv:ro
      - ../docker/config/local-test-keys/4:/opt/keys:ro
    command: >
      run-nakamoto
      /opt/genesis.csv
      --ip node-1
      --public-port 9010
      --p2p-port 9011
      --cli-port 9012
      --seedlist /opt/seedlist.csv
      --collateral 0
    depends_on:
      - sidecar-1
    networks:
      nakamoto:
        aliases: [node-1]

  # ── Node 2 ────────────────────────────────────────────
  sidecar-2:
    <<: *sidecar-common
    container_name: nakamoto-sidecar-2
    command: [
      "-grpc", "0.0.0.0:50051",
      "-listen", "/ip4/0.0.0.0/tcp/9500",
      "-seedlist", "/dns4/nakamoto-sidecar-0/tcp/9500,/dns4/nakamoto-sidecar-1/tcp/9500"
    ]
    networks:
      nakamoto:
        aliases: [sidecar-2]

  node-2:
    <<: *jvm-common
    container_name: nakamoto-node-2
    environment:
      <<: *jvm-env
      CL_KEYSTORE: /opt/keys/key.p12
      SIDECAR_HOST: sidecar-2
      SIDECAR_GRPC_PORT: "50051"
      CL_PUBLIC_HTTP_PORT: "9020"
      CL_P2P_HTTP_PORT: "9021"
      CL_CLI_HTTP_PORT: "9022"
    volumes:
      - ./genesis.csv:/opt/genesis.csv:ro
      - ./seedlist.csv:/opt/seedlist.csv:ro
      - ../docker/config/local-test-keys/5:/opt/keys:ro
    command: >
      run-nakamoto
      /opt/genesis.csv
      --ip node-2
      --public-port 9020
      --p2p-port 9021
      --cli-port 9022
      --seedlist /opt/seedlist.csv
      --collateral 0
    depends_on:
      - sidecar-2
    networks:
      nakamoto:
        aliases: [node-2]

networks:
  nakamoto:
    driver: bridge
