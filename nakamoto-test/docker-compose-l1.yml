# dag-l1 overlay — 3 L1 nodes (BFT consensus) connected to Nakamoto GL0
# Usage:
#   docker compose -f docker-compose-8node.yml -f docker-compose-l1.yml up --build -d
# Or standalone after GL0 is running:
#   docker compose -f docker-compose-l1.yml up --build -d

x-l1-common: &l1-common
  build:
    context: ..
    dockerfile: nakamoto-test/Dockerfile.l1
  environment: &l1-env
    CL_APP_ENV: dev
    CL_KEYALIAS: alias
    CL_PASSWORD: password
    CL_COLLATERAL: "0"
    JAVA_OPTS: "-Xmx512m -Xss256k --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.security=ALL-UNNAMED"

services:
  # ── L1 Node 0 (initial validator) ──────────────────────
  l1-node-0:
    <<: *l1-common
    container_name: nakamoto-l1-0
    environment:
      <<: *l1-env
      CL_KEYSTORE: /opt/keys/key.p12
      CL_PUBLIC_HTTP_PORT: "9100"
      CL_P2P_HTTP_PORT: "9101"
      CL_CLI_HTTP_PORT: "9102"
    volumes:
      - ../docker/config/local-test-keys/0:/opt/keys:ro
    command: >
      run-initial-validator
      --ip l1-node-0
      --public-port 9100
      --p2p-port 9101
      --cli-port 9102
      --l0-peer-id 1b4b9f98190ede0d26ec1a2ce736638ffa556b08135403256d47d3c405e08e3bb272fb9172c7bd9f96008dd380ceb6201e965498bc9115bbdf905ad9781dbf18
      --l0-peer-host node-0
      --l0-peer-port 9000
      --collateral 0
    ports:
      - "9100:9100"
      - "9102:9102"
    networks:
      nakamoto:
        aliases: [l1-node-0]

  # ── L1 Node 1 (validator, joins node-0) ────────────────
  l1-node-1:
    <<: *l1-common
    container_name: nakamoto-l1-1
    environment:
      <<: *l1-env
      CL_KEYSTORE: /opt/keys/key.p12
      CL_PUBLIC_HTTP_PORT: "9110"
      CL_P2P_HTTP_PORT: "9111"
      CL_CLI_HTTP_PORT: "9112"
    volumes:
      - ../docker/config/local-test-keys/1:/opt/keys:ro
    command: >
      run-validator
      --ip l1-node-1
      --public-port 9110
      --p2p-port 9111
      --cli-port 9112
      --l0-peer-id 1b4b9f98190ede0d26ec1a2ce736638ffa556b08135403256d47d3c405e08e3bb272fb9172c7bd9f96008dd380ceb6201e965498bc9115bbdf905ad9781dbf18
      --l0-peer-host node-0
      --l0-peer-port 9000
      --collateral 0
    networks:
      nakamoto:
        aliases: [l1-node-1]

  # ── L1 Node 2 (validator, joins node-0) ────────────────
  l1-node-2:
    <<: *l1-common
    container_name: nakamoto-l1-2
    environment:
      <<: *l1-env
      CL_KEYSTORE: /opt/keys/key.p12
      CL_PUBLIC_HTTP_PORT: "9120"
      CL_P2P_HTTP_PORT: "9121"
      CL_CLI_HTTP_PORT: "9122"
    volumes:
      - ../docker/config/local-test-keys/2:/opt/keys:ro
    command: >
      run-validator
      --ip l1-node-2
      --public-port 9120
      --p2p-port 9121
      --cli-port 9122
      --l0-peer-id 1b4b9f98190ede0d26ec1a2ce736638ffa556b08135403256d47d3c405e08e3bb272fb9172c7bd9f96008dd380ceb6201e965498bc9115bbdf905ad9781dbf18
      --l0-peer-host node-0
      --l0-peer-port 9000
      --collateral 0
    networks:
      nakamoto:
        aliases: [l1-node-2]

networks:
  nakamoto:
    external: true
    name: nakamoto-test_nakamoto
