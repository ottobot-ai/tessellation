global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'nakamoto-nodes'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'node-0:9000'
          - 'node-1:9010'
          - 'node-2:9020'
          - 'node-3:9030'
          - 'node-4:9040'
          - 'node-5:9050'
          - 'node-6:9060'
          - 'node-7:9070'
        labels:
          cluster: 'nakamoto-local'
